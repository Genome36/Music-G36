<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Redirecting...</title>

		<meta property="og:type" content="music.song">
		<meta property="og:title" content="Track out now on streaming platforms">
		<meta property="og:description" content="New release by Genome36">
		<meta property="og:image" content="https://music.genome36.com/tracks/default.jpg">
		<meta property="og:url" content="https://music.genome36.com/">

		<meta property="og:site_name" content="Genome36 Music">
		<meta property="og:image:width" content="1202">
		<meta property="og:image:height" content="1024">

		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="New release">
		<meta name="twitter:description" content="New release by Genome36">
		<meta name="twitter:image" content="https://music.genome36.com/tracks/default.jpg">

		<script>
			(function () {
				const path = location.pathname.split('/').filter(Boolean);

				if (path.length >= 2) {
					let type = path[0];
					let uuid = path[1];

					// short types
					if (type === 't') type = 'track';
					if (type === 'a') type = 'album';
					if (type === 'p') type = 'playlist';

					// check
					if (['track', 'album', 'playlist'].includes(type)) {
						const base = location.origin + '/';
						const url = `${base}index.html?uuid=${uuid}&type=${type}`;
						location.replace(url);
						return;
					}
				}

				// fallback if not matched
				location.replace(location.origin + '/');
			})();
		</script>
	</head>
<body></body>
</html>
