<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="icon" href="/favicon/favicon.ico">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png">
		<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">

		<title>Genome36 Music</title>
		<link rel="stylesheet" href="/css/track/style.css">

		<link rel="canonical" href="https://music.genome36.com/">
		<meta name="robots" content="index, follow">

		<!-- Open Graph -->
		<meta property="og:title" content="Track out now on streaming platforms">
		<meta property="og:description" content="New release by Genome36">
		<meta property="og:type" content="music.song">
		<meta property="og:site_name" content="Genome36 Music">
		<meta property="og:url" content="https://music.genome36.com/">

		<!-- Open Graph Image -->
		<meta property="og:image" content="https://music.genome36.com/tracks/default.jpg">
		<meta property="og:image:secure_url" content="https://music.genome36.com/tracks/default.jpg">
		<meta property="og:image:alt" content="Album artwork by Genome36">
		<meta property="og:image:type" content="image/jpeg">
		<meta property="og:image:width" content="1024">
		<meta property="og:image:height" content="1024">

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="New release">
		<meta name="twitter:description" content="New release by Genome36">
		<meta name="twitter:image" content="https://music.genome36.com/tracks/default.jpg">

		<meta name="ownership" content="Oren Titane">
		<meta name="facebook-domain-verification" content="oqpywn266nihkz7cn6bkueijpu1dul" />
		<meta name="google-site-verification" content="lcT5foBJzFbupEialnLNSwYCGiBn3AJ5FTq3W9lvVKs" />

		<!-- Structured data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebSite",
			"name": "Genome36 Music",
			"alternateName": "Genome36",
			"url": "https://music.genome36.com/"
		}
		</script>
	</head>
	<body>
		<div id="shade"></div>

		<div id="background"></div>

		<div class="container">
			<div id="redirect" class="link hidden"></div>

			<div class="cover_container">
				<div id="cover">
					<div id="share" class="btn link"></div>
				</div>
			</div>

			<div class="info">
				<div id="title"></div>
				<div id="artist"></div>
				<div id="date"></div>
			</div>

			<div id="services"></div>
		</div>

		<script type="module" src="/js/track/ui.js"></script>
	</body>
</html>
